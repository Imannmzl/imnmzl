<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D RPG Mobile Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Virtual D-Pad -->
    <div id="virtualDPad">
        <div class="dpad-container">
            <button class="dpad-btn dpad-up" data-direction="up">⬆️</button>
            <div class="dpad-middle">
                <button class="dpad-btn dpad-left" data-direction="left">⬅️</button>
                <button class="dpad-btn dpad-right" data-direction="right">➡️</button>
            </div>
            <button class="dpad-btn dpad-down" data-direction="down">⬇️</button>
        </div>
    </div>
    
    <!-- Debug Panel -->
    <div id="debugPanel">
        <button id="debugToggle">🐛</button>
        <div id="debugInfo" class="debug-info hidden">
            <div>Character: <span id="charPos">0, 0</span></div>
            <div>Camera: <span id="camPos">0, 0</span></div>
            <div>Zoom: <span id="zoomLevel">1.3x</span></div>
            <button id="gridToggle">Grid: OFF</button>
            <button id="teleportMode">Teleport: OFF</button>
        </div>
    </div>
    
    <!-- Crosshair -->
    <div id="crosshair" class="crosshair hidden"></div>
    
    <script src="game.js"></script>
</body>
</html>
